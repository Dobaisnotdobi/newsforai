name: Check Naver configuration
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/preflight.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets without printing values
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          names = ('NAVER_CLIENT_ID', 'NAVER_CLIENT_SECRET', 'NAVER_REFRESH_TOKEN')
          missing = [name for name in names if not os.environ.get(name)]
          for name in names:
              print(name + ': ' + ('MISSING' if name in missing else 'configured'))
          if missing:
              raise SystemExit('Naver credentials are incomplete. No publication attempted.')
          print('Presence check passed. Authentication and board access still require verification.')
          PY
